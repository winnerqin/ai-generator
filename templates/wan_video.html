let wanRegenerateData=null;

function sync(){const m=$('mode').value;$('ratio').disabled=m.startsWith('image_to_video');$('modeHint').textContent=hint();$('uploadModeHint').textContent=m==='text_to_video'?'文生视频无需选择素材，但仍可上传本地素材到 OSS 和内容库。':'上传成功后会保存到内容库，并自动加入当前任务。';renderChosen()}

function add(a){if($('mode').value==='text_to_video')return alert('文生视频不需要素材');const r=role(a);if((r==='first_frame'||r==='last_frame')&&(audio(a)||video(a)))return alert('首帧和尾帧必须是图片');if(chosen.some(x=>x.url===a.url&&x.role===r))return;if(r==='first_frame'||r==='last_frame')chosen=chosen.filter(x=>x.role!==r);chosen.push({...a,role:r});persistChosen();renderChosen()}
let savedPromptRange=null;
function savePromptSelection(){const editor=$('prompt'),selection=window.getSelection();if(!selection||!selection.rangeCount)return;const range=selection.getRangeAt(0);if(editor.contains(range.commonAncestorContainer))savedPromptRange=range.cloneRange()}
function insertPromptMention(index){const asset=chosen[index],editor=$('prompt');if(!asset)return;editor.focus();const mention=document.createElement('span');mention.className='prompt-reference';mention.contentEditable='false';mention.dataset.referenceUrl=asset.url;mention.textContent=assetLabel(index);let range=savedPromptRange&&editor.contains(savedPromptRange.commonAncestorContainer)?savedPromptRange.cloneRange():null;if(!range){range=document.createRange();range.selectNodeContents(editor);range.collapse(false)}const fragment=document.createDocumentFragment();if(editor.innerText&&!/\s$/.test(editor.innerText))fragment.appendChild(document.createTextNode(' '));fragment.appendChild(mention);fragment.appendChild(document.createTextNode(' '));range.deleteContents();range.insertNode(fragment);range=document.createRange();range.setStartAfter(mention.nextSibling||mention);range.collapse(true);const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);savedPromptRange=range.cloneRange()}
function removePromptMention(url){$('prompt').querySelectorAll('.prompt-reference').forEach(node=>{if(node.dataset.referenceUrl===url)node.remove()})}
function syncPromptMentionLabels(){$('prompt').querySelectorAll('.prompt-reference').forEach(node=>{const index=chosen.findIndex(a=>a.url===node.dataset.referenceUrl);if(index>=0)node.textContent=assetLabel(index)})}
function showPreview(index){if(!chosen.length)return;previewIndex=(index+chosen.length)%chosen.length;const a=chosen[previewIndex],label=assetLabel(previewIndex);$('lightboxStage').innerHTML=audio(a)?`<audio src="${esc(a.url)}" controls autoplay></audio>`:video(a)?`<video src="${esc(a.url)}" controls autoplay></video>`:`<img src="${esc(a.url)}">`;$('lightboxTitle').textContent=`${label} · ${a.filename||'-'}`;$('lightbox').classList.remove('hidden')}
let previewIndex=0,dragIndex=null;
function renderChosen(){const el=$('selected');syncPromptMentionLabels();if(!chosen.length){el.innerHTML='<span class="hint">还没有选择素材。</span>';return}el.innerHTML=chosen.map((a,i)=>{const label=assetLabel(i);return`<div class="selected-item" draggable="true" data-drag="${i}"><span class="drag-handle" title="拖动排序">⋮⋮</span><div data-preview="${i}">${media(a)}</div><div><strong>${esc(label)}</strong><div>${esc(a.filename||'-')}</div></div><div class="selected-actions"><button class="btn btn-secondary" type="button" data-insert="${i}">插入</button><button class="btn btn-danger" type="button" data-rm="${i}">移除</button></div></div>`}).join('');el.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const [removed]=chosen.splice(+b.dataset.rm,1);if(removed)removePromptMention(removed.url);persistChosen();renderChosen()});el.querySelectorAll('[data-insert]').forEach(b=>b.onclick=()=>insertPromptMention(+b.dataset.insert));el.querySelectorAll('[data-preview]').forEach(x=>x.onclick=()=>showPreview(+x.dataset.preview));el.querySelectorAll('[data-drag]').forEach(x=>{x.ondragstart=()=>{dragIndex=+x.dataset.drag;x.classList.add('dragging')};x.ondragend=()=>{dragIndex=null;x.classList.remove('dragging')};x.ondragover=e=>e.preventDefault();x.ondrop=e=>{e.preventDefault();const target=+x.dataset.drag;if(dragIndex===null||dragIndex===target)return;const [moved]=chosen.splice(dragIndex,1);chosen.splice(target,0,moved);persistChosen();renderChosen()}})}
async function load(){const s=$('search').value.trim();$('library').innerHTML='<span class="hint">加载中…</span>';try{let url;if(type==='recent_generated'){const q=new URLSearchParams({page:String(page),page_size:String(size),status:'succeeded'});if(s)q.set('search',s);url=`/api/omni-video/tasks?${q}`}else{const q=new URLSearchParams({type,page:String(page),page_size:String(size)});if(s)q.set('search',s);url=`/api/content-library?${q}`}const r=await fetch(url),d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'加载失败');const a=type==='recent_generated'?(d.items||[]).filter(x=>x.video_url).map(x=>({id:`task-${x.task_id}`,url:x.video_url,filename:x.filename||`${x.task_id}.mp4`,type:'video',meta:{task_id:x.task_id,source:x.source,model:x.model}})):(d.assets||d.items||[]);total=+d.total||a.length;$('library').innerHTML=a.length?a.map((x,i)=>`<div class="asset" data-i="${i}">${media(x,'preview')}<div class="info">${esc(x.filename||'-')}<div class="hint">点击选择</div></div></div>`).join(''):'<span class="hint">暂无素材。</span>';$('library').querySelectorAll('[data-i]').forEach(c=>c.onclick=()=>add(a[+c.dataset.i]));const pages=Math.max(1,Math.ceil(total/size));$('pageInfo').textContent=`第 ${page} / ${pages} 页，共 ${total} 个`;$('prev').disabled=page<=1;$('next').disabled=page>=pages}catch(e){$('library').innerHTML=`<span class="hint">${esc(e.message)}</span>`}}
async function upload(files){if(!files.length)return;$('uploadBox').classList.add('busy');$('uploadLabel').textContent=`正在上传 0 / ${files.length}…`;try{let done=0;for(const f of files){const fd=new FormData();fd.append('file',f);fd.append('type',f.type.startsWith('image/')?'image_material':'media');const r=await fetch('/api/upload-media-asset',{method:'POST',body:fd}),d=await r.json();if(!r.ok||!d.success)throw Error(`${f.name}: ${d.error||'上传失败'}`);done++;$('uploadLabel').textContent=`正在上传 ${done} / ${files.length}…`;if($('mode').value!=='text_to_video')add(d.asset)}await load();$('status').textContent=`已成功上传 ${files.length} 个素材到内容库。`}catch(e){alert(e.message)}finally{$('uploadBox').classList.remove('busy');$('uploadLabel').textContent='点击选择图片、音频或视频，可批量上传至 OSS';$('uploadInput').value=''}}
$('mode').onchange=sync;$('clear').onclick=()=>{chosen=[];renderChosen()};$('uploadBox').onclick=()=>$('uploadInput').click();$('uploadInput').onchange=e=>upload([...e.target.files]);document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{type=b.dataset.open;page=1;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===type));load();$('libraryPanel').scrollIntoView({behavior:'smooth'})});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{type=b.dataset.tab;page=1;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));load()});$('searchBtn').onclick=()=>{page=1;load()};$('search').onkeydown=e=>{if(e.key==='Enter'){page=1;load()}};$('prev').onclick=()=>{if(page>1){page--;load()}};$('next').onclick=()=>{if(page*size<total){page++;load()}};

async function loadBalance(force=false){const el=$('aliyunBalance');el.textContent='加载中…';try{const r=await fetch(`/api/wan-video/balance${force?'?refresh=true':''}`),d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'查询失败');const userBalance=d.balance_type==='user';$('balanceLabel').textContent=userBalance?'我的余额':'阿里云余额';const symbols={CNY:'¥',USD:'$',JPY:'¥'};el.textContent=`${symbols[d.currency]||d.currency+' '}${Number(d.available_amount).toFixed(2)}`;el.title=userBalance?'平台账户可用余额':`现金余额：${d.available_cash_amount} ${d.currency}`}catch(e){el.textContent='查询失败';el.title=e.message}}$('refreshBalance').onclick=()=>loadBalance(true);loadBalance();setInterval(()=>loadBalance(false),60000);

$('submit').onclick=async()=>{const p={mode:$('mode').value,model:$('model').value,prompt:$('prompt').innerText.trim(),filename:$('filename').value.trim(),media:chosen.map(a=>({role:a.role,url:a.url})),resolution:$('resolution').value,ratio:$('ratio').value,duration:+$('duration').value,prompt_extend:$('promptExtend').checked,watermark:$('watermark').checked,client_request_id:crypto.randomUUID()};if($('seed').value)p.seed=+$('seed').value;$('submit').disabled=true;$('status').textContent='正在创建任务…';try{const r=await fetch('/api/wan-video/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)}),d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'创建失败');persistGenerationSettings();$('status').textContent=`任务已创建：${d.task.task_id}\n状态：${d.task.status}`}catch(e){$('status').textContent=e.message}finally{$('submit').disabled=false}};
</script></body></html>
