<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wan 3.0 视频</title>
<link rel="stylesheet" href="/static/styles.css"><link rel="stylesheet" href="/static/sidebar-nav.css"><style>
.main-content{padding:0}.wrap{max-width:1220px;margin:auto;padding:24px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:18px}.page-head h1{margin:0 0 8px}.balance-card{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid rgba(86,111,255,.3);border-radius:12px;white-space:nowrap;background:rgba(86,111,255,.06)}.balance-value{color:#9ed0ff;font-weight:700}.balance-refresh{width:auto!important;padding:4px 8px!important}.hint{color:#9ca8cf}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.panel{padding:18px;border-radius:16px;margin-bottom:16px}.field{display:grid;gap:7px;margin-bottom:14px}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.primary-row select,.primary-row input{height:44px;padding:8px 12px;font-size:1rem}input,select,textarea{width:100%;box-sizing:border-box}textarea{min-height:105px}.upload{border:2px dashed rgba(86,111,255,.4);border-radius:14px;padding:24px;text-align:center;cursor:pointer;background:rgba(86,111,255,.04)}.upload:hover{border-color:#7392ff;background:rgba(86,111,255,.09)}.upload.busy{opacity:.6;pointer-events:none}.upload-title{font-weight:600;margin-bottom:6px}.actions,.pager{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.selected{display:grid;gap:10px}.selected-item{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;padding:10px;border:1px solid rgba(86,111,255,.24);border-radius:12px}.thumb{width:70px;height:56px;background:rgba(0,0,0,.2);display:grid;place-items:center;border-radius:8px;overflow:hidden}.thumb img,.thumb video,.preview img,.preview video{width:100%;height:100%;object-fit:contain}.wan-library-head{display:flex!important;flex-direction:column!important;align-items:stretch!important;gap:14px}.wan-library-toolbar{display:flex!important;align-items:center!important;gap:10px!important;flex-wrap:wrap}.wan-library-search{display:flex;gap:10px;align-items:center;margin-left:auto;min-width:min(460px,100%)}.wan-library-search input{min-width:280px}.library{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px;margin-top:18px;min-height:145px}.asset{border:1px solid rgba(86,111,255,.22);border-radius:12px;overflow:hidden;cursor:pointer}.asset:hover{border-color:#7392ff}.preview{height:108px;background:rgba(0,0,0,.18);display:grid;place-items:center}.info{padding:8px;word-break:break-all}.active{background:rgba(86,111,255,.3)}.hidden{display:none!important}.status{white-space:pre-wrap}@media(max-width:900px){.page-head{flex-direction:column}.balance-card{align-self:stretch;justify-content:space-between}.grid,.row{grid-template-columns:1fr}.wan-library-search{margin-left:0;width:100%;min-width:0}.wan-library-search input{min-width:0}}
</style></head><body class="react-theme sidebar-compact"><div class="app-shell">{% include "_shared_sidebar.html" %}<main class="main-content"><div class="wrap">
<div class="page-head"><div><h1>Wan 3.0 视频生成</h1><div class="hint">从内容库选择素材，或上传本地素材至 OSS 后生成视频。</div></div><div class="balance-card"><span>阿里云余额</span><span id="aliyunBalance" class="balance-value">加载中…</span><button id="refreshBalance" class="btn btn-secondary balance-refresh" type="button" title="刷新余额">↻</button></div></div><div class="grid"><div>
<section class="panel"><div class="row primary-row"><div class="field"><label>生成模式</label><select id="mode"><option value="reference_to_video" selected>参考生视频</option><option value="text_to_video">文生视频</option><option value="image_to_video_first">图生视频 · 首帧</option><option value="image_to_video_first_last">图生视频 · 首尾帧</option></select></div><div class="field"><label>模型</label><select id="model"></select></div><div class="field"><label>文件名</label><input id="filename"></div></div><div class="field"><label>提示词</label><textarea id="prompt"></textarea></div><div class="row"><div class="field"><label>分辨率</label><select id="resolution"><option>480P</option><option selected>720P</option><option>1080P</option></select></div><div class="field"><label>画面比例</label><select id="ratio"><option>16:9</option><option>9:16</option><option>1:1</option><option>4:3</option><option>3:4</option></select></div><div class="field"><label>时长（秒）</label><input id="duration" type="number" min="1" value="5"></div></div><div class="row"><div class="field"><label>随机种子</label><input id="seed" type="number" min="0" max="2147483647"></div><label><input id="promptExtend" type="checkbox" checked> Prompt 智能改写</label><label><input id="watermark" type="checkbox"> AI 水印</label></div></section>
<section class="panel" id="assetPanel"><strong>素材上传与选择</strong><div id="uploadBox" class="upload" style="margin-top:12px"><div class="upload-title">＋ 上传本地素材</div><span id="uploadLabel" class="hint">点击选择图片、音频或视频，可批量上传至 OSS</span><input id="uploadInput" type="file" accept="image/*,audio/*,video/*" multiple hidden></div><p id="uploadModeHint" class="hint">上传成功后自动保存到内容库；已有素材请直接从下方素材库选择。</p></section></div><div>
<section class="panel"><div class="actions" style="justify-content:space-between"><strong>已选 Wan 素材</strong><button id="clear" class="btn btn-secondary">清除素材</button></div><p id="modeHint" class="hint"></p><div id="selected" class="selected"><span class="hint">还没有选择素材。</span></div></section><section class="panel"><div class="actions"><button id="submit" class="btn btn-primary">创建 Wan 视频任务</button><a class="btn btn-secondary" href="/omni-video-tasks?source=wan_video">查看任务管理</a></div><p id="status" class="hint status"></p></section></div></div>
<section class="panel" id="libraryPanel"><div class="wan-library-head"><strong>素材库</strong><div class="wan-library-toolbar"><button class="btn btn-secondary active" data-tab="image_material">图片素材</button><button class="btn btn-secondary" data-tab="media">音/视频素材</button><button class="btn btn-secondary" data-tab="recent_generated">最近生成</button><div class="wan-library-search"><input id="search" placeholder="按文件名搜索"><button id="searchBtn" class="btn btn-secondary">搜索</button></div></div></div><div id="library" class="library"><span class="hint">加载中…</span></div><div class="pager" style="justify-content:flex-end;margin-top:12px"><button id="prev" class="btn btn-secondary">上一页</button><span id="pageInfo" class="hint">第 1 页</span><button id="next" class="btn btn-secondary">下一页</button></div></section>
</div></main></div><script src="/static/sidebar-nav.js"></script><script src="/static/sidebar-shared.js"></script><script>
const $=x=>document.getElementById(x),esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let chosen=[],type='image_material',page=1,total=0;const size=24;
const audio=a=>a.type==='audio'||String(a.meta?.mime_type||'').startsWith('audio/'),video=a=>a.type==='video'||String(a.meta?.mime_type||'').startsWith('video/');
function hint(){return({text_to_video:'文生视频不需要素材。',image_to_video_first:'请选择 1 张图片作为首帧。',image_to_video_first_last:'请依次选择首帧和尾帧图片。',reference_to_video:'可选择参考图片、视频或音频。'})[$('mode').value]}
function sync(){const m=$('mode').value;$('ratio').disabled=m.startsWith('image_to_video');$('modeHint').textContent=hint();$('uploadModeHint').textContent=m==='text_to_video'?'文生视频无需选择素材，但仍可上传本地素材到 OSS 和内容库。':'上传成功后会保存到内容库，并自动加入当前任务。';chosen=[];renderChosen()}
function role(a){const m=$('mode').value;if(m==='image_to_video_first')return'first_frame';if(m==='image_to_video_first_last')return chosen.some(x=>x.role==='first_frame')?'last_frame':'first_frame';return audio(a)?'reference_audio':video(a)?'reference_video':'reference_image'}
const roleName=r=>({first_frame:'首帧',last_frame:'尾帧',reference_image:'参考图片',reference_video:'参考视频',reference_audio:'参考音频'})[r];
function media(a,cls='thumb'){if(audio(a))return`<div class="${cls}" style="font-size:34px">♪</div>`;return`<div class="${cls}">${video(a)?`<video src="${esc(a.url)}" preload="metadata"></video>`:`<img src="${esc(a.url)}">`}</div>`}
function add(a){if($('mode').value==='text_to_video')return alert('文生视频不需要素材');const r=role(a);if((r==='first_frame'||r==='last_frame')&&(audio(a)||video(a)))return alert('首帧和尾帧必须是图片');if(chosen.some(x=>x.url===a.url&&x.role===r))return;if(r==='first_frame'||r==='last_frame')chosen=chosen.filter(x=>x.role!==r);chosen.push({...a,role:r});renderChosen()}
function renderChosen(){const el=$('selected');if(!chosen.length){el.innerHTML='<span class="hint">还没有选择素材。</span>';return}el.innerHTML=chosen.map((a,i)=>`<div class="selected-item">${media(a)}<div><strong>${esc(roleName(a.role))}</strong><div>${esc(a.filename||'-')}</div></div><button class="btn btn-danger" data-rm="${i}">移除</button></div>`).join('');el.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{chosen.splice(+b.dataset.rm,1);renderChosen()})}
async function load(){const s=$('search').value.trim();$('library').innerHTML='<span class="hint">加载中…</span>';try{let url;if(type==='recent_generated'){const q=new URLSearchParams({page:String(page),page_size:String(size),status:'succeeded'});if(s)q.set('search',s);url=`/api/omni-video/tasks?${q}`}else{const q=new URLSearchParams({type,page:String(page),page_size:String(size)});if(s)q.set('search',s);url=`/api/content-library?${q}`}const r=await fetch(url),d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'加载失败');const a=type==='recent_generated'?(d.items||[]).filter(x=>x.video_url).map(x=>({id:`task-${x.task_id}`,url:x.video_url,filename:x.filename||`${x.task_id}.mp4`,type:'video',meta:{task_id:x.task_id,source:x.source,model:x.model}})):(d.assets||d.items||[]);total=+d.total||a.length;$('library').innerHTML=a.length?a.map((x,i)=>`<div class="asset" data-i="${i}">${media(x,'preview')}<div class="info">${esc(x.filename||'-')}<div class="hint">点击选择</div></div></div>`).join(''):'<span class="hint">暂无素材。</span>';$('library').querySelectorAll('[data-i]').forEach(c=>c.onclick=()=>add(a[+c.dataset.i]));const pages=Math.max(1,Math.ceil(total/size));$('pageInfo').textContent=`第 ${page} / ${pages} 页，共 ${total} 个`;$('prev').disabled=page<=1;$('next').disabled=page>=pages}catch(e){$('library').innerHTML=`<span class="hint">${esc(e.message)}</span>`}}
async function upload(files){if(!files.length)return;$('uploadBox').classList.add('busy');$('uploadLabel').textContent=`正在上传 0 / ${files.length}…`;try{let done=0;for(const f of files){const fd=new FormData();fd.append('file',f);fd.append('type',f.type.startsWith('image/')?'image_material':'media');const r=await fetch('/api/upload-media-asset',{method:'POST',body:fd}),d=await r.json();if(!r.ok||!d.success)throw Error(`${f.name}: ${d.error||'上传失败'}`);done++;$('uploadLabel').textContent=`正在上传 ${done} / ${files.length}…`;if($('mode').value!=='text_to_video')add(d.asset)}await load();$('status').textContent=`已成功上传 ${files.length} 个素材到内容库。`}catch(e){alert(e.message)}finally{$('uploadBox').classList.remove('busy');$('uploadLabel').textContent='点击选择图片、音频或视频，可批量上传至 OSS';$('uploadInput').value=''}}
$('mode').onchange=sync;$('clear').onclick=()=>{chosen=[];renderChosen()};$('uploadBox').onclick=()=>$('uploadInput').click();$('uploadInput').onchange=e=>upload([...e.target.files]);document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{type=b.dataset.open;page=1;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===type));load();$('libraryPanel').scrollIntoView({behavior:'smooth'})});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{type=b.dataset.tab;page=1;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));load()});$('searchBtn').onclick=()=>{page=1;load()};$('search').onkeydown=e=>{if(e.key==='Enter'){page=1;load()}};$('prev').onclick=()=>{if(page>1){page--;load()}};$('next').onclick=()=>{if(page*size<total){page++;load()}};
fetch('/api/wan-video/config').then(r=>r.json()).then(d=>{$('model').innerHTML=(d.models||[]).map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('');if(d.default_model)$('model').value=d.default_model;if(!d.configured)$('status').textContent='服务尚未配置 DASHSCOPE_API_KEY。'});sync();load();
async function loadBalance(force=false){const el=$('aliyunBalance');el.textContent='加载中…';try{const r=await fetch(`/api/wan-video/balance${force?'?refresh=true':''}`),d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'查询失败');const symbols={CNY:'¥',USD:'$',JPY:'¥'};el.textContent=`${symbols[d.currency]||d.currency+' '}${Number(d.available_amount).toFixed(2)}`;el.title=`现金余额：${d.available_cash_amount} ${d.currency}`}catch(e){el.textContent='查询失败';el.title=e.message}}$('refreshBalance').onclick=()=>loadBalance(true);loadBalance();setInterval(()=>loadBalance(false),60000);
$('submit').onclick=async()=>{const p={mode:$('mode').value,model:$('model').value,prompt:$('prompt').value.trim(),filename:$('filename').value.trim(),media:chosen.map(a=>({role:a.role,url:a.url})),resolution:$('resolution').value,ratio:$('ratio').value,duration:+$('duration').value,prompt_extend:$('promptExtend').checked,watermark:$('watermark').checked,client_request_id:crypto.randomUUID()};if($('seed').value)p.seed=+$('seed').value;$('submit').disabled=true;$('status').textContent='正在创建任务…';try{const r=await fetch('/api/wan-video/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)}),d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'创建失败');$('status').textContent=`任务已创建：${d.task.task_id}\n状态：${d.task.status}`}catch(e){$('status').textContent=e.message}finally{$('submit').disabled=false}};
</script></body></html>
