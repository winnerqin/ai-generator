<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>首页概览 - AI创作工具</title>
  <link rel="stylesheet" href="/static/styles.css"><link rel="stylesheet" href="/static/sidebar-nav.css">
  <style>
    .app-shell{display:flex;min-height:100vh}.main-content{flex:1;min-width:0}.page{padding:24px;max-width:1500px;margin:auto}
    .top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}.top h1{margin:0 0 5px;font-size:1.55rem}.muted{color:#9da9cc;font-size:.86rem}
    .filters{display:flex;gap:8px;flex-wrap:wrap}.filters button,.filters input{border:1px solid rgba(126,184,255,.28);background:rgba(12,20,38,.72);color:#e9efff;border-radius:9px;padding:8px 12px}.filters button.active{background:#4f83ef;border-color:#78a7ff}
    .cards{display:grid;grid-template-columns:repeat(5,minmax(135px,1fr));gap:12px;margin-bottom:18px}.card,.panel{background:rgba(16,26,49,.72);border:1px solid rgba(126,184,255,.18);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
    .metric{padding:16px}.metric .value{font-size:1.75rem;font-weight:750;margin:8px 0}.metric.danger .value{color:#ff8e9a}.metric.good .value{color:#7fe0b1}
    .layout{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.panel{padding:17px;margin-bottom:16px}.panel h2{font-size:1.02rem;margin:0 0 14px}
    .status-row{display:grid;grid-template-columns:110px repeat(5,1fr);gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(126,184,255,.1)}.status-row:last-child{border:0}.pill{text-align:center;padding:6px;border-radius:8px;background:rgba(126,184,255,.08);font-size:.82rem}
    .chart{display:flex;align-items:flex-end;height:180px;gap:8px;padding-top:15px}.bar-wrap{flex:1;min-width:8px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}.bar{width:72%;min-height:2px;background:linear-gradient(180deg,#79afff,#4f70dc);border-radius:6px 6px 2px 2px}.bar-label{font-size:.68rem;color:#8f9abd;white-space:nowrap}
    .task{padding:11px 0;border-bottom:1px solid rgba(126,184,255,.1);display:flex;justify-content:space-between;gap:12px}.task:last-child{border:0}.task strong{font-size:.9rem}.danger-text{color:#ff929e}
    .assets{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.asset{display:block;color:inherit;text-decoration:none}.asset-media{aspect-ratio:1.3;border-radius:9px;overflow:hidden;background:#09101f}.asset img,.asset video{width:100%;height:100%;object-fit:cover}.asset-name{font-size:.75rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:5px}
    table{width:100%;border-collapse:collapse;font-size:.83rem}th,td{text-align:left;padding:9px 7px;border-bottom:1px solid rgba(126,184,255,.1)}th{color:#9da9cc;font-weight:500}.empty{padding:28px;text-align:center;color:#8e99b9}.error{background:rgba(210,55,70,.13);border:1px solid rgba(255,90,110,.3);padding:12px;border-radius:10px;margin-bottom:15px;color:#ffb5bd}
    @media(max-width:1050px){.cards{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:650px){.page{padding:16px}.top{display:block}.filters{margin-top:14px}.assets{grid-template-columns:repeat(2,1fr)}.status-row{grid-template-columns:90px repeat(2,1fr)}.status-row .pill:nth-child(n+4){display:none}}
  </style>
</head>
<body><div id="reactApp"></div>
<script>window.__APP_CONTEXT__={username:"{{ user.username }}",role_code:"{{ user.role_code or '' }}",is_system_admin:{{ 'true' if user.role_code == 'system_admin' or user.username == 'system_admin' else 'false' }}};</script>
<script src="/static/vendor/react.production.min.js"></script><script src="/static/vendor/react-dom.production.min.js"></script><script src="/static/vendor/babel.min.js"></script><script src="/static/sidebar-react.js"></script><script src="/static/sidebar-nav.js"></script>
{% raw %}<script type="text/babel">
const {useEffect,useState}=React;
const labels={image:'生图',video:'视频',omni_video:'全能视频',wan_video:'Wan 视频',enhance:'增强'};
const statusLabels={waiting:'等待',running:'进行中',succeeded:'成功',failed:'失败',cancelled:'取消'};
const taskLinks={image:'/records',video:'/video-tasks',omni_video:'/omni-video-tasks',wan_video:'/omni-video-tasks',enhance:'/enhance-tasks'};
function App(){
 const [data,setData]=useState(null),[error,setError]=useState(''),[period,setPeriod]=useState('7d'),[scope,setScope]=useState(window.__APP_CONTEXT__.is_system_admin?'global':'project'),[projects,setProjects]=useState([]),[projectId,setProjectId]=useState('');
 const loadProjects=()=>fetch('/api/projects').then(r=>r.json()).then(d=>{if(d.success){setProjects(d.projects||[]);setProjectId(String(d.current_project_id||''))}});
 const load=()=>{setError('');const q=new URLSearchParams({period,scope});if(scope==='project'&&projectId)q.set('project_id',projectId);fetch('/api/dashboard?'+q).then(async r=>{const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'加载失败');setData(d)}).catch(e=>setError(e.message));};
 useEffect(()=>{loadProjects()},[]);useEffect(()=>{load()},[period,scope,projectId]);useEffect(()=>{const timer=setInterval(load,60000);return()=>clearInterval(timer)},[period,scope,projectId]);
 const switchProject=async id=>{setProjectId(id);await fetch('/api/projects/switch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project_id:id})})};
 const s=data?.summary||{},max=Math.max(1,...(data?.trends||[]).map(x=>x.total));
 return <div className="app-shell"><window.AppSidebar activePage="dashboard" username={window.__APP_CONTEXT__.username} projects={projects} currentProjectId={projectId} onProjectChange={switchProject}/><main className="main-content"><div className="page">
  <div className="top"><div><h1>{data?.context?.scope==='global'?'平台运行概览':'当前项目概览'}</h1><div className="muted">聚焦任务进度、异常与最近作品 · 更新于 {data?.context?.generated_at||'--'}</div></div><div className="filters">{window.__APP_CONTEXT__.is_system_admin&&<button className={scope==='global'?'active':''} onClick={()=>setScope(scope==='global'?'project':'global')}>{scope==='global'?'全站数据':'当前项目'}</button>}<button className={period==='7d'?'active':''} onClick={()=>setPeriod('7d')}>近 7 天</button><button className={period==='30d'?'active':''} onClick={()=>setPeriod('30d')}>近 30 天</button><button onClick={load}>刷新</button></div></div>
  {error&&<div className="error">{error} <button onClick={load}>重试</button></div>}
  <div className="cards"><Metric label="今日任务" value={s.today}/><Metric label="进行中" value={s.running}/><Metric label="失败任务" value={s.failed} cls="danger"/><Metric label="近 30 天完成" value={s.completed_30d} cls="good"/><Metric label="成功率" value={(s.success_rate||0)+'%'} cls="good"/></div>
  <div className="layout"><div>
   <section className="panel"><h2>任务状态</h2>{Object.keys(data?.task_status||{}).length?Object.entries(data.task_status).map(([kind,v])=><div className="status-row" key={kind}><strong>{labels[kind]||kind}</strong>{Object.keys(statusLabels).map(k=><span className="pill" key={k}>{statusLabels[k]} {v[k]||0}</span>)}</div>):<Empty/>}</section>
   <section className="panel"><h2>创作趋势</h2>{data?.trends?.length?<div className="chart">{data.trends.map(x=><div className="bar-wrap" key={x.date} title={`${x.date}：${x.total}`}><div className="bar" style={{height:`${Math.max(2,x.total/max*100)}%`}}></div><span className="bar-label">{String(x.date).slice(5)}</span></div>)}</div>:<Empty/>}</section>
   <section className="panel"><h2>最近作品</h2>{data?.recent_assets?.length?<div className="assets">{data.recent_assets.map(a=><a className="asset" href="/content-management" key={a.type+'-'+a.id}><div className="asset-media">{a.type==='video'?<video src={a.url} muted/>:<img src={a.url} loading="lazy"/>}</div><div className="asset-name">{a.filename||'未命名作品'}</div></a>)}</div>:<Empty/>}</section>
  </div><div>
   <section className="panel"><h2>需要关注</h2>{data?.attention_tasks?.length?data.attention_tasks.map(t=><a className="task" href={taskLinks[t.task_type]||'/dashboard'} key={t.task_type+t.task_id}><span><strong>{labels[t.task_type]||t.task_type} · {t.task_id}</strong><div className="muted">{t.error_message||t.updated_at||t.created_at}</div></span><span className="danger-text">{t.status}</span></a>):<Empty text="目前没有异常或积压任务"/>}</section>
   {data?.admin_insights&&<Admin data={data.admin_insights}/>}
  </div></div>
 </div></main></div>
}
function Metric({label,value,cls=''}){return <div className={'card metric '+cls}><div className="muted">{label}</div><div className="value">{value??0}</div></div>}
function Empty({text='暂无数据'}){return <div className="empty">{text}</div>}
function Admin({data}){return <><section className="panel"><h2>模型稳定性</h2>{data.models?.length?<table><thead><tr><th>模型</th><th>调用</th><th>成功率</th><th>平均耗时</th></tr></thead><tbody>{data.models.map(x=><tr key={x.model}><td>{x.model}</td><td>{x.calls}</td><td>{x.success_rate}%</td><td>{x.avg_seconds||0}s</td></tr>)}</tbody></table>:<Empty/>}</section><section className="panel"><h2>高频错误</h2>{data.frequent_errors?.length?<table><tbody>{data.frequent_errors.map((x,i)=><tr key={i}><td>{labels[x.task_type]||x.task_type}</td><td className="danger-text">{x.error}</td><td>{x.count}</td></tr>)}</tbody></table>:<Empty text="当前周期没有失败错误"/>}</section><section className="panel"><h2>用户活跃</h2><div className="cards" style={{gridTemplateColumns:'1fr 1fr'}}><Metric label="活跃用户" value={data.active_user_count}/><Metric label="新增用户" value={data.new_users}/></div>{data.active_users?.length?<table><tbody>{data.active_users.slice(0,6).map(x=><tr key={x.id}><td>{x.username}</td><td>{x.task_count} 个任务</td><td>{x.last_active||'--'}</td></tr>)}</tbody></table>:<Empty/>}<p><a href="/stats">查看完整报表 →</a></p></section></>}
ReactDOM.createRoot(document.getElementById('reactApp')).render(<App/>);
</script>{% endraw %}</body></html>
